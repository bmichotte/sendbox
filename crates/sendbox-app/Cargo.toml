[package]
name = "sendbox-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sendbox: the thin Tauri shell (tray, window) around the core."
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sendbox-core = { path = "../sendbox-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1", features = ["sync"] }

# Launch at login: macOS asks SMAppService itself (the plugin only writes a
# LaunchAgent there), Windows keeps the plugin.
[target.'cfg(target_os = "macos")'.dependencies]
smappservice-rs = "0.1"

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-autostart = "2"
