[package]
name = "sendbox-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Sendbox core: SMTP Capture and Inbox storage, independent of Tauri."

[dependencies]
mail-parser = "1.0"
rusqlite = { version = "0.42", features = ["bundled"] }
smtp-proto = "0.2"
thiserror = "2"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "macros", "time"] }

[dev-dependencies]
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
